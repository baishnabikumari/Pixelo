<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixelo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appHeader">
    <span class="appTitle">Pixelo</span>
    <div class="headerButtons">
      <button class="iconButton" id="exportPngButton" title="Export PNG">⬇</button>
      <label class="iconButton importLabel" title="Import PNG">
        ⬆
        <input type="file" id="importPngInput" accept="image/*" hidden>
      </label>
      <button class="iconButton" id="exportSheetButton" title="Export sprite sheet (all frames)">▦</button>
      <button class="iconButton wide" id="exportJsonButton" title="Export frame data as JSON">{ }</button>
      <button class="iconButton wide" id="exportGifButton" title="Export animated GIF">GIF⬇</button>
    </div>
  </header>

  <div class="editorArea">
    <aside class="toolbar">
      <button class="toolButton" data-tool="pencil" title="Pencil (B)">Pencil</button>
      <button class="toolButton" data-tool="eraser" title="Eraser (E)">Eraser</button>
      <button class="toolButton" data-tool="fill" title="Fill (G)">Fill</button>
      <button class="toolButton" data-tool="picker" title="Color picker (I)">Picker</button>
      <button class="toolButton" data-tool="line" title="Line (L)">Line</button>
      <button class="toolButton" data-tool="rectangle" title="Rectangle (R)">Rectangle</button>
      <button class="toolButton" data-tool="ellipse" title="Ellipse (O)">Ellipse</button>
      <button class="toolButton" data-tool="dither" title="Dither (D)">Dither</button>

      <label class="checkRow" title="Fill rectangles and ellipses">
        <input type="checkbox" id="fillShapes"> Filled
      </label>

      <label class="checkRow" title="Mirro strokes left and right">
        <input type="checkbox" id="mirrorXBox"> Sym X
      </label>
      <label class="checkRow" title="Mirror strokes up and dowm">
        <input type="checkbox" id="mirrorYBox"> Sym Y
      </label>

      <input type="color" id="colorPicker" value="#3a86ff" title="Draw color">
      <input type="color" id="ditherColorPicker" value="#000000" title="Dither color">

      <div class="paletteBox">
        <div class="paletteSwatches" id="paletteSwatches"></div>
        <input type="text" id="paletteImportInput" placeholder="hex list or URL">
        <button class="toolButton" id="paletteImportButton">Import</button>

        <label class="checkRow" title="Snap drawn colors to the palette">
          <input type="checkbox" id="paletteLockBox"> Lock to palette
        </label>

        <label class="toolButton paletteExtractLabel">
          Extract from image
          <input type="file" id="paletteExtractInput" accept="image/*" hidden>
        </label>
      </div>

      <div class="historyRow">
        <button class="toolButton" id="undoButton" title="Undo (Ctrl+Z)">Undo</button>
        <button class="toolButton" id="redoButton" title="Redo (Ctrl+Y)">Redo</button>
        <button class="toolButton" id="onionSkinButton" title="Onion skin">Onion</button>
      </div>
    </aside>

    <main class="workspace" id="workspace">
      <canvas id="editorCanvas"></canvas>
    </main>

    <aside class="layerPanel">
      <div class="panelHeader">
        <span>Layers</span>
        <button class="panelButton" id="addLayerButton" title="Add layer">+</button>
      </div>

      <div class="layerList" id="layerList"></div>

      <div class="opacityRow">
        <label for="opacitySlider">Opacity</label>
        <input type="range" id="opacitySlider" min="0" max="100" value="100">
        <span id="opacityValue">100%</span>
      </div>
    </aside>
  </div>

  <div class="frameStrip">
    <div class="previewBox">
      <canvas id="previewCanvas" width="32" height="32"></canvas>
      <button class="panelButton" id="playButton" title="Play/pause preview">▶</button>
      <label class="fpsRow">
        FPS
        <input type="range" id="fpsSlider" min="1" max="24" value="8">
        <span id="fpsValue">8</span>
      </label>
    </div>

    <div class="frameList" id="frameList"></div>
    <button class="panelButton" id="addFrameButton" title="Add frame">+</button>
  </div>

  <footer class="statusBar">
    <span id="toolInfo"></span>
    <span id="cursorInfo">x: - y: -</span>
    <span id="sizeInfo"></span>
    <span id="zoomInfo"></span>
  </footer>

  <script src="gif.js"></script>
  <script src="app.js"></script>
</body>
</html>
